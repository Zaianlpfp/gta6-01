<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — GTA-style Open World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game-canvas" width="1280" height="720"></canvas>
<script src="vendor/three.min.js"></script>
<script src="engine.js"></script>
<script src="city.js"></script>
<script src="player.js"></script>
<script src="vehicles.js"></script>
<script src="police.js"></script>
<script src="missions.js"></script>
<script src="dialog.js"></script>
<script src="hud.js"></script>
<script src="radio.js"></script>
<script src="map.js"></script>
<script src="shops.js"></script>
<script src="save.js"></script>
<script src="audio.js"></script>
<script>
// Solmar Bay bootstrap (B5): tiny event bus + query parser, then boot.
// Engine owns the RAF loop; it calls SB.missions.update(dt) and
// SB.hud.update()/render() every frame, so this file only wires startup.
(function () {
  var SB = window.SB;
  var bus = {};
  SB.on = function (ev, fn) { (bus[ev] = bus[ev] || []).push(fn); return SB; };
  SB.off = function (ev, fn) {
    var a = bus[ev]; if (!a) return SB;
    var i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); return SB;
  };
  SB.emit = function (ev, data) {
    var a = bus[ev] || [], i;
    for (i = 0; i < a.length; i++) { try { a[i](data); } catch (e) {} }
    return SB;
  };
  SB.parseQuery = function () {
    var q = {}, s = (location.search || '').replace(/^\?/, '').split('&'), i, kv;
    for (i = 0; i < s.length; i++) {
      kv = s[i].split('=');
      if (kv[0]) q[kv[0]] = decodeURIComponent(kv[1] || '');
    }
    return q;
  };
  // Audio unlocks on first gesture; Space/arrows must not scroll the page.
  var cv = document.getElementById('game-canvas');
  function unlock() { try { if (SB.audio && SB.audio.unlock) SB.audio.unlock(); } catch (e) {} }
  cv.addEventListener('pointerdown', unlock);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
    unlock();
  });
  window.addEventListener('resize', function () { try { SB.engine.render(); } catch (e) {} });
  // HUD first (it owns #dlg, minimap canvas, pause banner), then boot.
  SB.hud.init();
  SB.engine.bootFromQuery();
})();
</script>
</body>
</html>
